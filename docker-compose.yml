services:
  backend:
    build: ./backend
    container_name: resilientsteps_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - CITYOS_PROFILE=${CITYOS_PROFILE:-local}
    depends_on:
      - valhalla
    restart: unless-stopped
    volumes:
      - ./config:/config:ro
      - ./backend/uploads:/app/uploads

  shade-db:
    image: postgres:16-alpine
    container_name: resilientsteps_shade_db
    # Opt-in service (SETUP.md Step 5b): plain `docker compose up -d` skips it;
    # start explicitly with `docker compose up -d shade-db` only if you want
    # satellite shade. The backend runs fine without it (OSM-canopy shade).
    profiles: ["shade"]
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${SHADE_DB_USER:-shade}
      - POSTGRES_PASSWORD=${SHADE_DB_PASSWORD:-shade_local}
      - POSTGRES_DB=${SHADE_DB_NAME:-shade_db}
    volumes:
      - shade_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: resilientsteps_valhalla
    ports:
      - "8002:8002"
    volumes:
      - valhalla_tiles:/custom_files
    environment:
      - tile_urls=${VALHALLA_TILE_URL:-https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf}
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
      - force_rebuild=False
    restart: unless-stopped

volumes:
  valhalla_tiles:
  shade_db_data:
