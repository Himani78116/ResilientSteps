services:
  backend:
    build: .
    container_name: cityos_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CITYOS_PROFILE=${CITYOS_PROFILE:-local}
    depends_on:
      - valhalla
    restart: unless-stopped
    volumes:
      - ../config:/config:ro
      - ./uploads:/app/uploads

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: cityos_valhalla
    ports:
      - "8002:8002"
    volumes:
      - valhalla_tiles:/custom_files
    environment:
      - tile_urls=${VALHALLA_TILE_URL:-https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf}
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
      - force_rebuild=False
    restart: unless-stopped

volumes:
  valhalla_tiles:
