profile: local
description: "Development on a laptop"

backend:
  host: "0.0.0.0"
  port: 8000
  reload: true
  workers: 1

database:
  source: "env"

storage:
  type: "local"
  path: "backend/uploads/"

valhalla:
  url: "http://localhost:8002"

tunnel:
  enabled: false

demo:
  seed_data: false
  mock_users: false

cache:
  safety_dataset_refresh_seconds: 60

cors:
  origins:
    - "*"  # dev profile: flutter run picks a random web port; narrow per-env in prod profiles only
